[project]
name = "ragmongodbdemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JyotiRishikesh", email = "jyotiaiupskilling@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.1",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "pymongo>=4.19.0",
    "pypdf>=6.21.4",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[project.scripts]
ragmongodbdemo = "ragmongodbdemo:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
